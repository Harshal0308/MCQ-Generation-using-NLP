<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --accent-color: #818cf8;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        
        .quiz-container {
            max-width: 800px;
            border-radius: 12px;
            background-color: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .header-wrapper {
            position: relative;
            margin-bottom: 30px;
        }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .progress-container {
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            transition: width 0.5s ease;
        }
        
        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .timer-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(var(--primary-color) 0%, #e2e8f0 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .timer-circle::before {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }
        
        .timer-text {
            position: relative;
            font-size: 1.2rem;
            z-index: 1;
        }
        
        .question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.5;
        }
        
        .choice-container {
            margin-bottom: 12px;
        }
        
        .choice-label {
            display: block;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .choice-label:hover {
            background-color: #f3f4f6;
            transform: translateY(-2px);
        }
        
        .choice-input {
            display: none;
        }
        
        .choice-input:checked + .choice-label {
            border-color: var(--primary-color);
            background-color: rgba(99, 102, 241, 0.1);
        }
        
        .choice-input:checked + .choice-label::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background-color: var(--primary-color);
        }
        
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn-quiz {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-previous {
            background-color: #e2e8f0;
            color: var(--text-color);
        }
        
        .btn-previous:hover:not(:disabled) {
            background-color: #cbd5e1;
        }
        
        .btn-next {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-next:hover:not(:disabled) {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .btn-submit {
            background-color: var(--success-color);
            color: white;
        }
        
        .btn-submit:hover:not(:disabled) {
            background-color: #059669;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .warning-time {
            color: var(--danger-color);
        }
        
        .question-counter {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 500;
        }
        
        .choice-text {
            font-weight: 500;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .quiz-container {
                margin: 10px;
                padding: 20px;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .timer-circle {
                width: 50px;
                height: 50px;
            }
            
            .timer-circle::before {
                width: 40px;
                height: 40px;
            }
            
            .timer-text {
                font-size: 1rem;
            }
            
            .button-container {
                flex-wrap: wrap;
            }
            
            .btn-quiz {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="quiz-container animate__animated animate__fadeIn">
            <div class="header-wrapper">
                <div class="quiz-header">
                    <h2 class="mb-0">Interactive Quiz</h2>
                    <div id="timer-container" class="timer-container">
                        <div class="timer-circle">
                            <span id="timer-text" class="timer-text">30</span>
                        </div>
                        <span id="timer-label">seconds</span>
                    </div>
                </div>
                <p class="question-counter mb-2">Question {{ current_question }} of {{ total_questions }}</p>
                <div class="progress-container">
                    <div class="progress-bar" style="width: calc({{ current_question }} / {{ total_questions }} * 100%)"></div>
                </div>
            </div>
            
            <div class="question-content animate__animated animate__fadeIn">
                <p class="question-text">{{ question }}</p>
                
                <form method="POST" id="quiz-form">
                    <div class="choices-container">
                        {% for choice in choices %}
                            <div class="choice-container animate__animated animate__fadeInUp" style="animation-delay: {{ loop.index0 * 0.1 }}s">
                                <input 
                                    class="choice-input" 
                                    type="radio" 
                                    name="answer" 
                                    id="choice{{ loop.index0 }}" 
                                    value="{{ choice }}"
                                    {% if user_answer == choice %}checked{% endif %}
                                >
                                <label class="choice-label" for="choice{{ loop.index0 }}">
                                    <span class="choice-indicator">{{ ["A", "B", "C", "D", "E"][loop.index0] }}.</span>
                                    <span class="choice-text">{{ choice }}</span>
                                </label>
                            </div>
                        {% endfor %}
                    </div>
                    
                    <div class="button-container">
                        <button type="submit" name="previous" class="btn btn-quiz btn-previous" {% if current_question == 1 %}disabled{% endif %}>
                            <i class="fas fa-arrow-left"></i> Previous
                        </button>
                        <button type="submit" name="next" id="next-button" class="btn btn-quiz btn-next" {% if current_question == total_questions %}disabled{% endif %}>
                            Next <i class="fas fa-arrow-right"></i>
                        </button>
                        <button type="submit" name="submit" class="btn btn-quiz btn-submit" {% if current_question != total_questions %}disabled{% endif %}>
                            <i class="fas fa-check"></i> Submit Quiz
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        // Timer functionality
        let timer = 30; // 30 seconds for each question
        const timerText = document.getElementById("timer-text");
        const timerLabel = document.getElementById("timer-label");
        const timerCircle = document.querySelector(".timer-circle");
        
        const countdown = setInterval(() => {
            // Update timer text
            timerText.textContent = timer;
            
            // Update timer circle progress
            const progressPercentage = (timer / 30) * 100;
            timerCircle.style.background = `conic-gradient(
                var(--primary-color) ${progressPercentage}%, 
                #e2e8f0 ${progressPercentage}%
            )`;
            
            // Add warning when time is low
            if (timer <= 10) {
                timerText.classList.add("warning-time");
                timerCircle.classList.add("pulse");
                timerLabel.classList.add("warning-time");
            }
            
            // Handle timer completion
            if (timer <= 0) {
                clearInterval(countdown);
                document.getElementById("next-button").click();
            } else {
                timer--;
            }
        }, 1000);
        
        // Add click sound to choices
        const choiceInputs = document.querySelectorAll('.choice-input');
        choiceInputs.forEach(input => {
            input.addEventListener('change', () => {
                // You could add a subtle sound here if desired
                // For now, add a visual indication instead
                const allLabels = document.querySelectorAll('.choice-label');
                allLabels.forEach(label => {
                    label.classList.remove('animate__pulse');
                });
                
                input.nextElementSibling.classList.add('animate__animated', 'animate__pulse');
            });
        });
        
// Prevent accidental page navigation but allow form submissions
let formSubmitted = false;

// Mark form as submitted when any button is clicked
document.querySelectorAll('button[type="submit"]').forEach(button => {
    button.addEventListener('click', function() {
        formSubmitted = true;
    });
});

// Only show warning if navigating away without using form buttons
window.addEventListener('beforeunload', function(e) {
    if (!formSubmitted) {
        e.preventDefault();
        e.returnValue = '';
    }
    // Reset after each navigation attempt
    formSubmitted = false;
});
    </script>
</body>
</html>
